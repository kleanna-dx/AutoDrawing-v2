<!DOCTYPE html>
<html><head><title>Fillet Direction Test</title></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<rect width="800" height="600" fill="#f5f5f5"/>

<!-- Case 1: adjLargerL, Left-Top -->
<!-- 기어(큰) 왼쪽, Boss(작) 오른쪽 -->
<g transform="translate(50, 50)">
  <text x="0" y="-10" font-size="14" fill="#333">Case 1: adjLargerL Left-Top</text>
  <!-- 기어 상단선 (높은 위치) -->
  <line x1="0" y1="0" x2="100" y2="0" stroke="#999" stroke-width="1"/>
  <!-- 단차 수직선 -->
  <line x1="100" y1="0" x2="100" y2="50" stroke="black" stroke-width="2"/>
  <!-- Boss 상단선 -->
  <line x1="100" y1="50" x2="250" y2="50" stroke="black" stroke-width="2"/>
  <!-- 코너 꼭짓점 = (100, 50) -->
  <circle cx="100" cy="50" r="3" fill="blue"/>
  <text x="105" y="65" font-size="10" fill="blue">corner</text>
  
  <!-- 올바른 필렛: center=(100,50), R=20 -->
  <!-- start=(100, 30) [수직선위], end=(120, 50) [수평선위] -->
  <!-- sweep=1 테스트 -->
  <path d="M 100 30 A 20 20 0 0 1 120 50" stroke="red" stroke-width="2.5" fill="none"/>
  <text x="125" y="35" font-size="10" fill="red">sweep=1 (올바른?)</text>
  
  <!-- sweep=0 테스트 -->
  <path d="M 100 30 A 20 20 0 0 0 120 50" stroke="green" stroke-width="2.5" fill="none" stroke-dasharray="4"/>
  <text x="125" y="25" font-size="10" fill="green">sweep=0</text>
</g>

<!-- Case 2: adjLargerL, Left-Bottom -->
<g transform="translate(50, 200)">
  <text x="0" y="-10" font-size="14" fill="#333">Case 2: adjLargerL Left-Bottom</text>
  <!-- Boss 하단선 -->
  <line x1="100" y1="0" x2="250" y2="0" stroke="black" stroke-width="2"/>
  <!-- 단차 수직선 -->
  <line x1="100" y1="0" x2="100" y2="50" stroke="black" stroke-width="2"/>
  <!-- 기어 하단선 -->
  <line x1="0" y1="50" x2="100" y2="50" stroke="#999" stroke-width="1"/>
  <!-- 코너 = (100, 0) -->
  <circle cx="100" cy="0" r="3" fill="blue"/>
  
  <!-- start=(120, 0), end=(100, 20) -->
  <path d="M 120 0 A 20 20 0 0 1 100 20" stroke="red" stroke-width="2.5" fill="none"/>
  <text x="125" y="15" font-size="10" fill="red">sweep=1</text>
  <path d="M 120 0 A 20 20 0 0 0 100 20" stroke="green" stroke-width="2.5" fill="none" stroke-dasharray="4"/>
  <text x="125" y="5" font-size="10" fill="green">sweep=0</text>
</g>

<!-- Case 3: adjLargerR, Right-Top -->
<g transform="translate(400, 50)">
  <text x="0" y="-10" font-size="14" fill="#333">Case 3: adjLargerR Right-Top</text>
  <!-- Boss 상단선 -->
  <line x1="0" y1="50" x2="100" y2="50" stroke="black" stroke-width="2"/>
  <!-- 단차 수직선 -->
  <line x1="100" y1="0" x2="100" y2="50" stroke="black" stroke-width="2"/>
  <!-- 인접 상단선 -->
  <line x1="100" y1="0" x2="250" y2="0" stroke="#999" stroke-width="1"/>
  <!-- 코너 = (100, 50) -->
  <circle cx="100" cy="50" r="3" fill="blue"/>
  
  <!-- start=(80, 50), end=(100, 30) -->
  <path d="M 80 50 A 20 20 0 0 1 100 30" stroke="red" stroke-width="2.5" fill="none"/>
  <text x="50" y="35" font-size="10" fill="red">sw=1</text>
  <path d="M 80 50 A 20 20 0 0 0 100 30" stroke="green" stroke-width="2.5" fill="none" stroke-dasharray="4"/>
  <text x="50" y="25" font-size="10" fill="green">sw=0</text>
</g>

<!-- Case 4: bossLargerR, Right-Top (Boss > 인접) -->
<g transform="translate(400, 200)">
  <text x="0" y="-10" font-size="14" fill="#333">Case 4: bossLargerR Right-Top</text>
  <!-- Boss 상단선 (높음) -->
  <line x1="0" y1="0" x2="100" y2="0" stroke="black" stroke-width="2"/>
  <!-- 단차 수직선 -->
  <line x1="100" y1="0" x2="100" y2="50" stroke="black" stroke-width="2"/>
  <!-- 인접 상단선 (낮음) -->
  <line x1="100" y1="50" x2="250" y2="50" stroke="#999" stroke-width="1"/>
  <!-- 코너 = (100, 50) -->
  <circle cx="100" cy="50" r="3" fill="blue"/>
  
  <!-- start=(100, 30), end=(120, 50) -->
  <path d="M 100 30 A 20 20 0 0 1 120 50" stroke="red" stroke-width="2.5" fill="none"/>
  <text x="125" y="35" font-size="10" fill="red">sw=1</text>
  <path d="M 100 30 A 20 20 0 0 0 120 50" stroke="green" stroke-width="2.5" fill="none" stroke-dasharray="4"/>
  <text x="125" y="25" font-size="10" fill="green">sw=0</text>
</g>

<!-- Case 5: bossLargerL, Left-Top (Boss > 인접) -->
<g transform="translate(50, 380)">
  <text x="0" y="-10" font-size="14" fill="#333">Case 5: bossLargerL Left-Top</text>
  <!-- Boss 상단선 (높음) -->
  <line x1="100" y1="0" x2="250" y2="0" stroke="black" stroke-width="2"/>
  <!-- 단차 수직선 -->
  <line x1="100" y1="0" x2="100" y2="50" stroke="black" stroke-width="2"/>
  <!-- 인접 상단선 (낮음) -->
  <line x1="0" y1="50" x2="100" y2="50" stroke="#999" stroke-width="1"/>
  <!-- 코너 = (100, 50) -->
  <circle cx="100" cy="50" r="3" fill="blue"/>
  
  <!-- start=(120, 50), end=(100, 30) -->
  <path d="M 120 50 A 20 20 0 0 1 100 30" stroke="red" stroke-width="2.5" fill="none"/>
  <text x="125" y="35" font-size="10" fill="red">sw=1</text>
  <path d="M 120 50 A 20 20 0 0 0 100 30" stroke="green" stroke-width="2.5" fill="none" stroke-dasharray="4"/>
  <text x="125" y="25" font-size="10" fill="green">sw=0</text>
</g>

<text x="400" y="580" text-anchor="middle" font-size="16" fill="#333">빨간=sweep1, 초록점선=sweep0 - 코너를 오목하게 깎는 쪽이 정답</text>
</svg>
</body></html>
