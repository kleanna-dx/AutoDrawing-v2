<!DOCTYPE html>
<html><head><title>Sweep Check</title></head>
<body>
<h2>Verify correct sweep for step fillets</h2>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Test case: LEFT SIDE, adjLargerL=true (gear bigger than boss) -->
  <!-- bLeft=200, bTopY=150, adjTopY=100, R=20 -->
  <!-- Inside corner at (200, 150) -->
  <!-- Arc center at (220, 130) — inside the notch -->
  <!-- Start: (200, 130) on step vertical -->
  <!-- End: (220, 150) on boss horizontal -->
  
  <g transform="translate(50,0)">
    <text x="100" y="30" font-size="14" font-weight="bold">LEFT step, top: sweep=1</text>
    <!-- Step vertical line -->
    <line x1="200" y1="100" x2="200" y2="130" stroke="black" stroke-width="2"/>
    <!-- Boss horizontal line -->  
    <line x1="220" y1="150" x2="350" y2="150" stroke="black" stroke-width="2"/>
    <!-- Arc sweep=1 (should curve into notch) -->
    <path d="M 200 130 A 20 20 0 0 1 220 150" stroke="red" stroke-width="2" fill="none"/>
    <text x="230" y="140" fill="red" font-size="11">sweep=1</text>
    <circle cx="200" cy="150" r="3" fill="blue"/>
    <text x="170" y="165" fill="blue" font-size="10">corner</text>
  </g>
  
  <g transform="translate(400,0)">
    <text x="100" y="30" font-size="14" font-weight="bold">LEFT step, top: sweep=0</text>
    <line x1="200" y1="100" x2="200" y2="130" stroke="black" stroke-width="2"/>
    <line x1="220" y1="150" x2="350" y2="150" stroke="black" stroke-width="2"/>
    <path d="M 200 130 A 20 20 0 0 0 220 150" stroke="blue" stroke-width="2" fill="none"/>
    <text x="230" y="140" fill="blue" font-size="11">sweep=0</text>
    <circle cx="200" cy="150" r="3" fill="blue"/>
  </g>
  
  <!-- RIGHT SIDE step fillet test -->
  <g transform="translate(50,200)">
    <text x="100" y="30" font-size="14" font-weight="bold">RIGHT step, top: sweep=0</text>
    <!-- bRight=300, bTopY=150, adjTopY=100, R=20 -->
    <!-- Inside corner at (300, 150) -->
    <!-- Start: (300, 130) on step vertical -->
    <!-- End: (280, 150) on boss horizontal -->
    <line x1="300" y1="100" x2="300" y2="130" stroke="black" stroke-width="2"/>
    <line x1="150" y1="150" x2="280" y2="150" stroke="black" stroke-width="2"/>
    <path d="M 300 130 A 20 20 0 0 0 280 150" stroke="red" stroke-width="2" fill="none"/>
    <text x="255" y="140" fill="red" font-size="11">sweep=0</text>
    <circle cx="300" cy="150" r="3" fill="blue"/>
  </g>
  
  <g transform="translate(400,200)">
    <text x="100" y="30" font-size="14" font-weight="bold">RIGHT step, top: sweep=1</text>
    <line x1="300" y1="100" x2="300" y2="130" stroke="black" stroke-width="2"/>
    <line x1="150" y1="150" x2="280" y2="150" stroke="black" stroke-width="2"/>
    <path d="M 300 130 A 20 20 0 0 1 280 150" stroke="blue" stroke-width="2" fill="none"/>
    <text x="255" y="140" fill="blue" font-size="11">sweep=1</text>
    <circle cx="300" cy="150" r="3" fill="blue"/>
  </g>
</svg>
</body>
</html>
